# Areal Observability — docker-compose template (Phase 20).
#
# Rendered by bootstrap (envsubst) into docker-compose.yml.
# All five services run in `network_mode: host` so they share the VPS host
# network namespace. Each service binds 127.0.0.1:<port> directly — no
# bridge network, no docker DNS, no host-gateway alias. Scraping is
# always `localhost:<port>`. This co-location matches the operational
# story (single Fornex VPS) and avoids cross-namespace connectivity bugs.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE}
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs mounted to a separate path so the provisioning provider
      # YAML files (under /etc/grafana/provisioning/dashboards/) don't collide
      # with dashboard JSON files.
      - ./grafana/dashboards:/etc/grafana/dashboard-files:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    # Grafana binds 127.0.0.1:3000 via grafana.ini [server] http_addr / http_port.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=127.0.0.1:9115

volumes:
  prometheus-data:
  grafana-data:
