# Areal Observability — Grafana configuration template (Phase 20).
#
# Rendered by bootstrap via envsubst into grafana.ini.
# Anonymous Viewer access is enabled so the Infra dashboard is publicly readable.

[server]
root_url = ${GF_SERVER_ROOT_URL}
http_addr = 0.0.0.0
http_port = 3000

[security]
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
cookie_secure = true
strict_transport_security = true
allow_embedding = true

[auth]
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = ${GF_AUTH_ANONYMOUS_ORG_NAME}
org_role = Viewer

[users]
viewers_can_edit = false
default_theme = dark

[explore]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/infra.json

[analytics]
reporting_enabled = false
check_for_updates = false

[snapshots]
external_enabled = false
