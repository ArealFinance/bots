apiVersion: 1
datasources:
  - name: Prometheus
    # uid pinned so dashboards reference a stable identifier across reloads.
    uid: prometheus
    type: prometheus
    access: proxy
    # Host network mode in docker-compose — Grafana shares host net namespace
    # and reaches Prometheus on the host loopback.
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: ${PROM_SCRAPE_INTERVAL}
