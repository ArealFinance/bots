apiVersion: 1
providers:
  - name: Areal Dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      # Mounted from bots/observability/grafana/dashboards (JSONs); kept
      # separate from /etc/grafana/provisioning/* so the provider YAML and
      # the dashboard JSONs don't share the same directory.
      path: /etc/grafana/dashboard-files
