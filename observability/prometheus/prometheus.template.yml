# Areal Observability — Prometheus configuration template (Phase 20).
#
# Rendered from this template by the bootstrap script via envsubst.
# All ${VAR} references must resolve from .env.
# Locked defaults (PROM_RETENTION_*, PROM_SCRAPE_INTERVAL) are sourced from .env
# but documented in .env.example.

global:
  scrape_interval: ${PROM_SCRAPE_INTERVAL}
  scrape_timeout: 10s
  # Multi-env labels propagate to every series scraped by this Prometheus.
  # When this stack runs alongside another env's stack (Federation / second
  # Grafana datasource), the labels disambiguate metric origin.
  external_labels:
    env: "${AREAL_ENV}"            # business-plane: testnet | devnet | mainnet
    cluster: "${AREAL_CLUSTER}"     # physical cluster: fornex | prod-hetzner | ...
    network: "${SOLANA_NETWORK}"    # data-plane: solana-test-validator | devnet | mainnet

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

scrape_configs:
  # Prometheus self-scrape.
  - job_name: prometheus
    static_configs:
      - targets:
          - 'localhost:9090'

  # Host metrics from node-exporter (host network mode, binds 127.0.0.1:9100).
  - job_name: node
    static_configs:
      - targets:
          - 'localhost:9100'

  # Blackbox HTTP probes for public endpoints.
  # `replacement` rewrites the scrape target back to the blackbox-exporter
  # listening on 127.0.0.1:9115 (also host network mode).
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - '${BLACKBOX_TARGET_PANEL}'
          - '${BLACKBOX_TARGET_APP}'
          - '${BLACKBOX_TARGET_RPC}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # Phase 21 — bot instrumentation (prom-client) is live. Each crank binds
  # 127.0.0.1:910X on the host; prometheus shares the host network
  # namespace, so localhost:910X works directly.
  #
  # Job name is suffixed with the env (`bots-${AREAL_ENV}`) so that when a
  # second cluster's bots are added later (e.g. another scrape_config block
  # for `bots-mainnet` reaching across a WireGuard mesh), they do not
  # collide on `job` label and stay distinguishable in Grafana.
  - job_name: bots-${AREAL_ENV}
    static_configs:
      - targets:
          - 'localhost:9101'   # merkle-publisher
          - 'localhost:9102'   # revenue-crank
          - 'localhost:9103'   # pool-rebalancer
          - 'localhost:9104'   # convert-and-fund-crank
          - 'localhost:9105'   # yield-claim-crank
          - 'localhost:9106'   # nexus-manager

  # Phase 22 — uncomment when chain-invariants exporter lands.
  # - job_name: chain-invariants-${AREAL_ENV}
  #   static_configs:
  #     - targets:
  #         - 'localhost:9201'
