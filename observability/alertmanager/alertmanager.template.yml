# Areal Observability — Alertmanager configuration template (Phase 20).
#
# Rendered by bootstrap via envsubst. Phase 20 routes exclusively via
# Telegram; SMTP / Slack receivers are deferred to a later phase to
# keep this template minimal and `amtool check-config`-clean even with
# all optional env vars blank.

global:
  resolve_timeout: 5m

route:
  receiver: telegram-warning
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: telegram-critical
    - match:
        # Phase 20 has no SMS / paging integration yet — route page severity
        # to telegram-critical so it still gets immediate attention.
        severity: page
      receiver: telegram-critical
    - match:
        severity: warning
      receiver: telegram-warning

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID_CRITICAL}
        parse_mode: HTML
        send_resolved: true

  - name: telegram-warning
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID_WARNING}
        parse_mode: HTML
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]

# Phase 24 will introduce custom alert templates (HTML formatting helpers,
# runbook link prettifiers, etc.) and re-add a `templates:` block pointing
# at the rendered .tmpl files. Until then the directory is not mounted, so
# referencing it here only generates a noisy "no matches" warning on every
# Alertmanager reload.
