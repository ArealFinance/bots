# Areal Observability — Alertmanager configuration template (Phase 20).
#
# Rendered by bootstrap via envsubst. SMTP block is inert when SMTP_* vars
# are blank (Alertmanager tolerates blank SMTP fields when no email receiver
# references them — Phase 20 only routes via Telegram).

global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: telegram-warning
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: telegram-critical
    - match:
        # Phase 20 has no SMS / paging integration yet — route page severity
        # to telegram-critical so it still gets immediate attention.
        severity: page
      receiver: telegram-critical
    - match:
        severity: warning
      receiver: telegram-warning

receivers:
  - name: telegram-critical
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID_CRITICAL}
        parse_mode: HTML
        send_resolved: true

  - name: telegram-warning
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID_WARNING}
        parse_mode: HTML
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]

templates:
  - '/etc/alertmanager/templates/*.tmpl'
